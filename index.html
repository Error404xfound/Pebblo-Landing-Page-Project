<!DOCTYPE html>

<html lang = "en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/x-icon" href="/assets/logo.png">
        <title>Pebblo - Home</title>
        <link rel="stylesheet" href="styles.css" />
        <script src="https://unpkg.com/@phosphor-icons/web"></script>
    </head>

    <body>
        <header class = "site-header">
            <a href = "/" class = "brand">
                <img src = "assets/logo.svg" alt = "Pebblo's Company logo"/>
                <span>Pebblo</span>
            </a>

            <nav aria-label="Main Navigation">
                <ul class = "nav-menu">
                    <li><a href = "/">Home</a></li>
                    <li><a href = "/product">Product</a></li>
                    <li><a href = "/pricing">Pricing</a></li>
                    <li><a href = "/about-us">About us</a></li>
                </ul>
            </nav>
            
            <div class = "nav-menu-actions">
                <a href="/login" class="nav-link">Log in</a>
                <button type = "button" class ="nav-menu-cta-btn">Start with Pebblo</button>
            </div>

        </header>

        <main class = "hero-section">
            <div class = "hero-media">
                <img src = "assets/hero.svg" alt = "Pebblo handling many different tasks"/>

                <div class = "rating-badge">
                    <span class = "rating-score">4.5</span>
                    <div class = "star-group">
                        <i class="ph-fill ph-star"></i>
                        <i class="ph-fill ph-star"></i>
                        <i class="ph-fill ph-star"></i>
                        <i class="ph-fill ph-star"></i>
                        <i class="ph-fill ph-star-half"></i>
                    </div>
                    <span class="rating-group">
                        <i class="ph-duotone ph-users"></i> 100K+
                    </span>
                </div>

            </div>

            <div class="hero-content">
                <h1>Bye Procrastination,<br>Hello Pebblo</h1>
                <p class="hero-content-subtitle">The companion app that breaks down tasks and actually gets you started</p>
                <button type="button" class="hero-cta-btn">Start with Pebblo</button>
            </div>
        </main>
    </body>
</html>
